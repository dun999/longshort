# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: longshort-indexer
description: longshort.fun ArenaCore — matches, players, every onchain trade, payouts and XP on Monad
schema: ./schema.graphql
handlers: ./src/handlers
field_selection:
  transaction_fields:
    - hash
contracts:
  - name: ArenaCore
    abi_file_path: ./abis/ArenaCore.json
    events:
      - event: MatchCreated
      - event: PlayerJoined
      - event: PlayerLeft
      - event: ClassChanged
      - event: MatchStarted
      - event: Opened
      - event: Closed
      - event: Liquidated
      - event: Eliminated
      - event: Settled
      - event: Cancelled
      - event: TradingAccountCreated
      - event: FinalBalance
      - event: CollateralReturned
      - event: Closing
  - name: Perpl
    abi_file_path: ./abis/Perpl.json
    events:
      - event: OrderRequestV2
      - event: TakerOrderFilledV2
  - name: AUSD
    abi_file_path: ./abis/AUSD.json
    events:
      - event: Transfer
chains:
  - id: 10143 # Monad testnet
    start_block: 67943161 # PerplArena v2 (Duel, 2v2 Squad, Royale)
    # HyperSync is used automatically when ENVIO_API_TOKEN is set; the RPC below is the fallback.
    rpc:
      - url: ${ENVIO_RPC_URL:-https://testnet-rpc.monad.xyz}
        for: fallback # HyperSync is primary (ENVIO_API_TOKEN); this RPC is the backup
      - url: ${ENVIO_RPC_BACKUP_URL:-https://testnet-rpc.monad.xyz}
        for: fallback # A second provider if the first RPC fallback is unavailable
    contracts:
      - name: ArenaCore
        address:
          - 0x5Efae3185739539E28FedcA99118C6D4EC9B2C1A # AUSD Perpl arena v2: Duel, Squad 2v2, Royale
      - name: Perpl
        address: 0x1964C32f0bE608E7D29302AFF5E61268E72080cc
      - name: AUSD
        address: 0xa9012a055bd4e0eDfF8Ce09f960291C09D5322dC
